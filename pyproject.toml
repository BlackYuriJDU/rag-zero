[project]
name = "rag-zero"
version = "0.0.1"
description = "Grounded question answering over Brazilian public procurement (PNCP) — production RAG with real evals."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Arthur Araújo da Silva", email = "arthuraviacao55@gmail.com" }]
keywords = ["rag", "pncp", "licitacoes", "brazilian-portuguese", "llm", "retrieval", "evals"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12.3",
    "rich>=13.7",
    "fastembed>=0.9.0",
    "numpy>=2.4.6",
    "snowballstemmer>=3.1.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/BlackYuriJDU/rag-zero"
Issues = "https://github.com/BlackYuriJDU/rag-zero/issues"

[project.scripts]
rag-zero = "rag_zero.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_zero"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
